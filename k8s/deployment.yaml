apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-agent-framework-ui
  # TODO: Change namespace to match your target (e.g. production, staging)
  namespace: default
  labels:
    app: multi-agent-framework-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multi-agent-framework-ui
  template:
    metadata:
      labels:
        app: multi-agent-framework-ui
    spec:
      # TODO: If your ghcr.io packages are private, create a pull secret:
      #   kubectl create secret docker-registry ghcr-secret \
      #     --docker-server=ghcr.io \
      #     --docker-username=<your-github-username> \
      #     --docker-password=<your-github-pat> \
      #     --namespace=default
      # Then uncomment the block below:
      # imagePullSecrets:
      #   - name: ghcr-secret

      containers:
        - name: multi-agent-framework-ui
          # TODO: Replace <your-github-username> with your GitHub username or org
          image: ghcr.io/<your-github-username>/multi-agent-framework-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
